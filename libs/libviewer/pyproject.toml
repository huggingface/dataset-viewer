[tool.poetry]
authors = ["Krisztián Szűcs <krisztian@huggingface.co>"]
description = "Library for utils common to all the services"
name = "libviewer"
version = "0.2.0"
license = "Apache-2.0"

[tool.poetry.scripts]
dv = "libviewer.cli:cli"

[tool.poetry.dependencies]
anyio = ">=3.4.0,<5"
python = "3.14.5"
click = "^8.4.0"
pyarrow = "^24.0.0"
huggingface-hub = { git = "https://github.com/huggingface/huggingface_hub.git", rev = "1cc1d9d5d15929ad5e214cb3a121d3a0a108af20" }  # List large repos in parallel https://github.com/huggingface/huggingface_hub/pull/5153

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.14.6"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
# bindings = "pyo3"
module-name = "libviewer._internal"
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
features = ["pyo3/extension-module"]
