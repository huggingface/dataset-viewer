name: Launch Python unit tests
on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      poetry-args:
        required: false
        type: string
        default: ""


env:
  # required to get access to use a cached poetry venv in "/home/runner/.cache/pypoetry/virtualenvs"
  POETRY_VIRTUALENVS_IN_PROJECT: false
  mongo-port: "27017"
  mongo-version: "8.3.13-4"
  python-version: "3.14.5"
  poetry-version: "2.1.4"
  replicaset: "rs0"
permissions: {}

jobs:
  unit-tests:
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    # MongoDB 8.x refuses to start on Linux kernel 6.19+ (SERVER-121912), which ubuntu-latest now runs.
    # Move back to ubuntu-latest once the test image supports its kernel (8.3.14+ on kernel 7.0.14+).
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install poetry
        run: pipx install poetry==${{ env.poetry-version }}
      - name: Use Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.python-version }}
      - name: Install packages
        run: sudo apt update; sudo apt install -y ffmpeg libavcodec-extra libsndfile1 libjpeg-dev zlib1g-dev libegl1 libegl-mesa0
      - name: Cache the libviewer Rust build
        # every package installs libviewer through libcommon, and building it takes about 5 minutes. A cache key is
        # saved once: only the libcommon unit tests write it, after a full build, and every other job reads it.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: libs/libviewer
          shared-key: libviewer
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.working-directory == 'libs/libcommon' }}
      - name: Install dependencies
        # "poetry env use" is required: https://github.com/actions/setup-python/issues/374#issuecomment-1088938718
        run: |
          poetry env use "${{ env.python-version }}"
          poetry install ${{ inputs.poetry-args }}
      - name: Launch mongo
        env:
          MONGO_PORT: ${{ env.mongo-port }}
          MONGO_REPLICASET: ${{ env.replicaset }}
        run: |
          uname -r
          docker compose -f docker-compose-mongo.yml up -d --wait --wait-timeout 20
        working-directory: ./tools
      - name: Run unit tests
        env:
          CACHE_MONGO_URL: mongodb://localhost:${{ env.mongo-port }}
          QUEUE_MONGO_URL: mongodb://localhost:${{ env.mongo-port }}
          DATABASE_MIGRATIONS_MONGO_URL: mongodb://localhost:${{ env.mongo-port }}
          CI_SPAWNING_TOKEN: ${{ secrets.CI_SPAWNING_TOKEN }}
          ASSETS_STORAGE_ROOT: /tmp/assets
          CACHED_ASSETS_STORAGE_ROOT: /tmp/cached-assets
        run: poetry run python -m pytest -s -m "not real_dataset and not integration"
