name: libs/libcommon
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "libs/libcommon/**"
      - "libs/libviewer/**"
      - ".github/workflows/l-libcommon.yml"
      - ".github/workflows/_quality-python.yml"
      - ".github/workflows/_unit-tests-python.yml"
      - "tools/docker-compose-mongo.yml"
  pull_request:
    paths:
      - "libs/libcommon/**"
      - "libs/libviewer/**"
      - ".github/workflows/l-libcommon.yml"
      - ".github/workflows/_quality-python.yml"
      - ".github/workflows/_unit-tests-python.yml"
      - "tools/docker-compose-mongo.yml"
permissions:
  contents: read

jobs:
  quality-libcommon:
    uses: ./.github/workflows/_quality-python.yml
    with:
      working-directory: libs/libcommon
  unit-tests-libcommon:
    uses: ./.github/workflows/_unit-tests-python.yml
    permissions:
      contents: read
      # a reusable workflow cannot widen this, the caller has to grant it
      id-token: write
    with:
      working-directory: libs/libcommon
      aws-role: arn:aws:iam::707930574880:role/dataset-viewer-e2e
    secrets: inherit