[tool.poetry]
package-mode = false
name: e2e
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "e2e/**"
      - "libs/**"
      - "services/**"
      - "docs/source/openapi.json"
      - ".github/workflows/_e2e_tests.yml"
      - ".github/workflows/_quality-python.yml"
      - ".github/workflows/e2e.yml"
      - "tools/Python.mk"
      - ".env"
      - "Dockerfile"
      - "docker-compose.yml"
  pull_request:
    paths:
      - "e2e/**"
      - "libs/**"
      - "services/**"
      - "docs/source/openapi.json"
      - ".github/workflows/_e2e_tests.yml"
      - ".github/workflows/_quality-python.yml"
      - ".github/workflows/e2e.yml"
      - "tools/Python.mk"
      - ".env"
      - "Dockerfile"
      - "docker-compose.yml"
permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/_quality-python.yml
    with:
      working-directory: e2e
  e2e-tests:
    uses: ./.github/workflows/_e2e_tests.yml
    permissions:
      contents: read
      # a reusable workflow cannot widen this, the caller has to grant it
      id-token: write
    secrets: inherit