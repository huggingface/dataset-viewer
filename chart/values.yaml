common:
  # Comma-separated list of blocked datasets. No jobs will be processed for those datasets.
  blockedDatasets: "open-llm-leaderboard-old/details_*,lunaluan/*,atom-in-the-universe/*,cot-leaderboard/cot-eval-traces,mitermix/yt-links,mcding-org/*"
  # URL of the HuggingFace Hub
  hfEndpoint: ""

log:
  # Log level
  level: "INFO"

# --- common parameters ---

# Kubernetes ServiceAccount used by all pods.
# To enable IRSA (IAM Roles for Service Accounts), set:
#   serviceAccount.create: true
#   serviceAccount.annotations."eks.amazonaws.com/role-arn": "arn:aws:iam::<account-id>:role/<role-name>"
# and set s3.useIrsa: true so static AWS credentials are no longer injected.
serviceAccount:
  # if true, a ServiceAccount is created; otherwise the existing one named below (or "default") is used
  create: false
  # name of the ServiceAccount; defaults to the release name when empty
  name: ""
  # annotations added to the ServiceAccount, e.g. the IRSA role ARN
  annotations: {}

secrets:
  infisical:
    # if true, the Infisical operator syncs the secrets into a Kubernetes Secret, and every pod reads
    # them through `valueFrom.secretKeyRef` environment variables.
    enabled: false
    env: ""
    project: "datasets-server-n5x-l"
    url: ""
    resyncInterval: 60
    operatorSecretName: "datasets-server-operator-secrets"
    operatorSecretNamespace: "datasets-server"
    # CSI mode: each pod mounts only the secrets it needs as files in a tmpfs volume, and reads them
    # once at startup into process memory. No Kubernetes Secret is created and nothing is injected in
    # the environment. It supersedes the operator mode above, which should be disabled when this is on.
    #
    # The node's CSI provider is what talks to Infisical, so the pods hold no credential of their own.
    # It requires, none of which live in this repo:
    #   - the Secrets Store CSI Driver and the Infisical provider installed on the cluster
    #   - an Infisical machine identity the provider is configured to authenticate with
    #   - a provider build supporting windowDuration, if the read window below is to be enforced
    csi:
      enabled: false
      # Name the provider is registered under with the CSI driver.
      provider: "infisical"
      # How the provider authenticates to Infisical. "kubernetes" makes Infisical validate each pod's
      # service account token by calling TokenReview against this cluster's API server, which it refuses
      # when the endpoint resolves to a private address. "aws" signs with the provider's own IRSA role
      # instead and needs nothing reachable, so it is the default here. It is also the provider's default
      # that has to be overridden: left unset, the parameter falls back to "kubernetes".
      authMethod: "aws"
      # ID of the Infisical machine identity, and the project id. Injected at deploy time (private
      # overlay) along with secrets.infisical.url, since none of them are stored in this repo.
      identityId: ""
      projectId: ""
      # How long after a container starts its secrets stay readable. Past it the provider serves empty
      # files and stops calling Infisical, so the values never leave the platform rather than being
      # fetched and withheld. A restart reopens the window, since a restarted container needs its secrets
      # again and the kubelet replays nothing on its behalf.
      #
      # Measured from container start, not pod creation, and enforced at the granularity of the driver's
      # rotation poll, so the files actually blank up to one interval later (60s as deployed). The
      # application reads them once at startup and keeps them in memory, so this does not affect a running
      # process: what it removes is the ability to read them again hours later. Five minutes leaves room
      # for a slow init container or a restart cascade; going under a minute buys little against the poll
      # interval and makes the effective window unpredictable.
      #
      # Empty keeps them readable for the pod's whole life.
      windowDuration: "5m"
      mountPath: "/mnt/secrets"
      # Which Infisical secrets each workload mounts, so a pod only ever holds what it needs rather
      # than everything in the project. Each name lands as a file of the same name in mountPath.
      # This list is the blast radius of a compromised pod, so it is meant to be read and audited.
      workloads:
        admin: [MONGO_URL, HF_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
        api: [MONGO_URL, HF_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, CLOUDFRONT_KEY_PAIR_ID,
              CLOUDFRONT_PRIVATE_KEY, API_HF_JWT_ADDITIONAL_PUBLIC_KEYS]
        rows: [MONGO_URL, HF_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, CLOUDFRONT_KEY_PAIR_ID,
               CLOUDFRONT_PRIVATE_KEY, API_HF_JWT_ADDITIONAL_PUBLIC_KEYS]
        search: [MONGO_URL, HF_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, CLOUDFRONT_KEY_PAIR_ID,
                 CLOUDFRONT_PRIVATE_KEY, API_HF_JWT_ADDITIONAL_PUBLIC_KEYS]
        sse-api: [MONGO_URL, HF_TOKEN, API_HF_JWT_ADDITIONAL_PUBLIC_KEYS]
        webhook: [MONGO_URL, HF_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, CLOUDFRONT_KEY_PAIR_ID,
                  CLOUDFRONT_PRIVATE_KEY, WEBHOOK_SECRET, API_HF_JWT_ADDITIONAL_PUBLIC_KEYS,
                  PARQUET_CONVERTER_HF_TOKEN]
        worker: [MONGO_URL, HF_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
                 PARQUET_CONVERTER_HF_TOKEN, SPAWNING_TOKEN]
        backfill: [MONGO_URL, HF_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
        backfill-retryable-errors: [MONGO_URL, HF_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
        cache-metrics-collector: [MONGO_URL, HF_TOKEN]
        queue-metrics-collector: [MONGO_URL, HF_TOKEN]
        post-messages: [MONGO_URL, HF_TOKEN, PARQUET_CONVERTER_HF_TOKEN]
        mongodb-migration: [MONGO_URL]
  mongoUrl:
    fromSecret: false
    secretName: "mongo-url"
    value: mongo://
  appHfToken:
    fromSecret: true
    secretName: ""
    value: ""
  appParquetConverterHfToken:
    fromSecret: true
    secretName: ""
    value: ""
  hfWebhookSecret:
    fromSecret: false
    secretName: "webhook-secret"
    value: ""
  # a comma-separated list of additional public keys to use to decode the JWT sent by the Hugging Face Hub.
  # The public keys must be in PEM format and include "\n" for line breaks
  # ("-----BEGIN PUBLIC KEY-----\n....\n-----END PUBLIC KEY-----\n"). Defaults to empty.
  hfJwtAdditionalPublicKeys:
    fromSecret: false
    secretName: ""
    value: ""
  spawningToken:
    fromSecret: true
    secretName: ""
  s3:
    accessKeyId:
      fromSecret: true
      secretName: ""
    secretAccessKey:
      fromSecret: true
      secretName: ""
  cloudfront:
    keyPairId:
      fromSecret: false
      value: ""
    privateKey:
      fromSecret: false
      value: ""

uid: 1000
gid: 3000

persistence:
  parquetMetadata:
    existingClaim: ""

monitoring:
  enabled: false

# Optional deny-all egress NetworkPolicy for the pods of the release. The allowed destinations are
# supplied via these values at deploy time; with the empty default below it denies all egress but DNS.
networkPolicy:
  enabled: false
  allNamespacePods: false
  allowedCIDRs: []
  allowDNS: true
  extraEgress: []

mongodb:
  enabled: true
  nameOverride: datasets-server-mongodb
  useStatefulSet: true
  auth:
    enabled: false
  serviceAccount:
    create: false

cache:
  # Name of the mongo db database used to cache the API responses
  mongoDatabase: "datasets_server_cache"

queue:
  # Name of the mongo db database used to store the jobs queue
  mongoDatabase: "datasets_server_queue"

worker:
  # maximum size in bytes of the response content computed by a worker
  contentMaxBytes: "10_000_000"
  # the time interval between two heartbeats. Each heartbeat updates the job "last_heartbeat" field in the queue.
  heartbeatIntervalSeconds: 60
  # the time interval at which the worker looks for long jobs to kill them
  killLongJobIntervalSeconds: 60
  # the time interval at which the worker looks for zombie jobs to kill them
  killZombiesIntervalSeconds: 600
  # the maximum duration of a job before it gets stopped for exceeded the maximum duration
  maxJobDurationSeconds: 2400
  # Max CPU load (%) - if reached, sleeps until it comes back under the limit. Set to 0 to disable the test.
  maxLoadPct: 0
  # Max pod memory (%) relative to pod memory limit - if reached, refuses new jobs to give GC time
  # and leave headroom for sibling pods. Set to 0 to disable. Uses cgroup for accurate reading.
  maxMemoryPct: 0
  # Max system (node) memory (%) relative to total node RAM - if reached, refuses new jobs
  # to prevent system-wide pressure that triggers K8s SIGTERM eviction of ALL pods.
  maxSystemMemoryPct: 0
  # the number of heartbeats a job must have missed to be considered a zombie job.
  maxMissingHeartbeats: 5
  # Number of seconds a worker will sleep before trying to process a new job
  sleepSeconds: 5

firstRows:
  # Max size of the /first-rows endpoint response in bytes
  maxBytes: "1_000_000"
  # Min size of a cell in the /first-rows endpoint response in bytes
  minCellBytes: 100
  # Min number of rows in the /first-rows endpoint response
  minNumber: 10
  # Max number of columns in the /first-rows endpoint response
  columnsMaxNumber: 1_000

parquetAndInfo:
  # the git commit message when the parquet files are uploaded to the Hub. Defaults to `Update parquet files`.
  commitMessage: "Update parquet files"
  # the maximum size in bytes of the dataset to pre-compute the parquet files. Bigger datasets, or datasets without that information, are partially streamed to get parquet files up to this value.
  maxDatasetSizeBytes: "100_000_000"
  # the maximum number of external files of the datasets. Bigger datasets, or datasets without that information, are partially streamed to get parquet files up to `maxDatasetSizeBytes` bytes.
  maxExternalDataFiles: "10_000"
  # the git revision of the dataset to use to prepare the parquet files. Defaults to `main`.
  sourceRevision: "main"
  # the git revision of the dataset where to store the parquet files. Make sure the hf_token (see the "Common" section) allows to write there. Defaults to `refs/convert/parquet`.
  targetRevision: "refs/convert/parquet"
  # the URL template to build the parquet file URLs. Defaults to `/datasets/%s/resolve/%s/%s`.
  urlTemplate: "/datasets/%s/resolve/%s/%s"

optInOutUrlsScan:
  columnsMaxNumber: 10
  # the max number of columns to scan
  maxConcurrentRequestsNumber: 10
  # the max concurrent request number
  maxRequestsPerSecond: 20
  # the max number of request allowed to process in parallel per second
  rowsMaxNumber: 1_000
  # the max number of rows to scan
  urlsNumberPerBatch: 1_000
  # the number of grouped urls to be send in every request to spawning
  spawningUrl: "https://opts-api.spawningaiapi.com/api/v2/query/urls"
  # the URL for spawning requests

configNames:
  # the max number of configs per dataset
  maxNumber: 4_000

s3:
  regionName: "us-east-1"
  useIrsa: false

cloudfront:
  # CloudFront expiration delay in seconds, for the signed URLs
  expirationSeconds: 3600

assets:
  # base URL for the assets files. It should be set accordingly to the datasets-server domain, eg https://datasets-server.huggingface.co/assets
  # baseUrl: "not used for now"
  # name of the folder where assets are stored.
  storageRoot: "/storage/assets"
  storageProtocol: "file"

cachedAssets:
  # base URL for the cached assets files. It should be set accordingly to the datasets-server domain, eg https://datasets-server.huggingface.co/cached-assets
  # baseUrl: "not used for now"
  # name of the folder where cached assets are stored.
  storageRoot: "/storage/cached-assets"
  storageProtocol: "file"

parquetMetadata:
  # Directory on the shared storage (parquet metadata files used for random access in /rows)
  storageDirectory: "/storage/parquet-metadata"

duckDBIndex:
  # Directory on the local storage (used to cache the duckdb files for /filter and /search)
  cacheDirectory: "/tmp/duckdb-index"
  # Directory on the worker (used temporarily to prepare the duckdb indexes before sending to the Hub)
  workerDirectory: "/tmp/duckdb-index"
  # the git commit message when the duckdb index file is uploaded to the Hub. Defaults to `Update duckdb index files`.
  commitMessage: "Update duckdb index files"
  # the git revision of the dataset where to store the duckdb index file. Defaults to `refs/convert/duckdb`.
  targetRevision: "refs/convert/duckdb"
  # the URL template to build the duckdb index file URL. Defaults to `/datasets/%s/resolve/%s/%s`.
  urlTemplate: "/datasets/%s/resolve/%s/%s"
  # the maximum size of the split parquets.
  maxSplitSizeBytes: "100_000_000"

rowsIndex:
  # Maximum number of bytes to load in memory from parquet row groups to avoid OOM
  maxArrowDataInMemory: "300_000_000"

descriptiveStatistics:
  # Directory used temporarily to download dataset locally in .parquet to compute statistics
  cacheDirectory: "/tmp/stats-cache"
  # fixed number of bins for histogram count
  histogramNumBins: 10
  # the maximum size of the split parquets.
  maxSplitSizeBytes: "100_000_000"

hfDatasetsCache:
  # Directory where the HF datasets cache data will be stored
  cacheDirectory: "/tmp/hf-datasets-cache"

discussions:
  # name of the Hub user associated with the dataset viewer bot app
  botAssociatedUserName: "parquet-converter"

# --- jobs (pre-install/upgrade hooks) ---

mongodbMigration:
  # Whether to run the mongo migration pre-upgrade hook. Disable e.g. for a parallel deploy that
  # shares an already-migrated prod mongo.
  enabled: true
  # Name of the mongo db database used for storing the migrations history
  mongoDatabase: "datasets_server_maintenance"

  nodeSelector: {}
  resources:
    requests:
      cpu: 0
    limits:
      cpu: 0
  tolerations: []

# --- cron jobs  ---
backfill:
  enabled: false
  log:
    level: "info"
  action: "backfill"
  schedule: "0 */3 * * *"
  # every 3 hours
  nodeSelector: {}
  resources:
    requests:
      cpu: 0
    limits:
      cpu: 0
  tolerations: []

backfillRetryableErrors:
  enabled: false
  log:
    level: "info"
  action: "backfill-retryable-errors"
  schedule: "*/10 * * * *"
  # every 10 minutes
  nodeSelector: {}
  resources:
    requests:
      cpu: 0
    limits:
      cpu: 0
  tolerations: []

postMessages:
  enabled: true
  log:
    level: "info"
  action: "post-messages"
  schedule: "10 0 * * *"
  # at 00:10
  nodeSelector: {}
  resources:
    requests:
      cpu: 0
    limits:
      cpu: 0
  tolerations: []

queueMetricsCollector:
  enabled: true
  action: "collect-queue-metrics"
  schedule: "14 00 * * *"
  nodeSelector: {}
  resources:
    requests:
      cpu: 0
    limits:
      cpu: 0
  tolerations: []

cacheMetricsCollector:
  enabled: true
  action: "collect-cache-metrics"
  schedule: "13 00 * * *"
  nodeSelector: {}
  resources:
    requests:
      cpu: 0
    limits:
      cpu: 0
  tolerations: []

# --- ALB ---

ingress:
  enabled: true
  tls: []
  annotations: {}

# --- services ---

admin:
  # HF organization that is allowed to request the report
  hfOrganization: "datasets-maintainers"
  # Number of reports in /cache-reports/... endpoints
  cacheReportsNumResults: 100
  # Number of reports in /cache-reports-with-content/... endpoints
  cacheReportsWithContentNumResults: 100
  # the timeout in seconds for the requests to the Hugging Face Hub.
  hfTimeoutSeconds: "0.2"
  # The path of the whoami service on the hub.
  hfWhoamiPath: "/api/whoami-v2"
  # Number of seconds to set in the `max-age` header on technical endpoints
  maxAge: "10"
  # Directory where the uvicorn workers share their prometheus metrics
  # see https://github.com/prometheus/client_python#multiprocess-mode-eg-gunicorn
  prometheusMultiprocDirectory: "/tmp"
  # hostname - it must not be set to localhost to work in Kube!
  uvicornHostname: "0.0.0.0"
  # Number of uvicorn workers for running the application
  uvicornNumWorkers: "1"
  # Application endpoint port
  uvicornPort: 8080

  nodeSelector: {}
  replicas: 1
  resources:
    requests:
      cpu: 0
    limits:
      cpu: 0
  service:
    type: ""
    annotations: {}
  ingress:
    enabled: true
    annotations: {}
  ingressInternal:
    enabled: false
    annotations: {}
  tolerations: []

hf:
  # the path of the external authentication service on the hub.
  # The string must contain `%s` which will be replaced with the dataset name.
  authPath: "/api/datasets/%s/auth-check"
  # the URL where the "Hub JWT public key" is published. The "Hub JWT public key" must be in JWK format.
  # It helps to decode a JWT sent by the Hugging Face Hub, for example, to bypass the external authentication
  # check (JWT in the 'X-Api-Key' header). If not set, the JWT are ignored.
  jwtPublicKeyUrl: "https://huggingface.co/api/keys/jwt"
  # the algorithm used to encode the JWT.
  jwtAlgorithm: "EdDSA"
  # the timeout in seconds for the requests to the Hugging Face Hub.
  timeoutSeconds: "0.2"

api:
  # Number of seconds to set in the `max-age` header on data endpoints
  maxAgeLong: "120"
  # Number of seconds to set in the `max-age` header on technical endpoints
  maxAgeShort: "10"
  # Directory where the uvicorn workers will write the prometheus metrics
  # see https://github.com/prometheus/client_python#multiprocess-mode-eg-gunicorn
  prometheusMultiprocDirectory: "/tmp"
  # Hostname - it must not be set to localhost to work in Kube!
  uvicornHostname: "0.0.0.0"
  # Number of uvicorn workers for running the application
  uvicornNumWorkers: "1"
  # Application endpoint port
  uvicornPort: 8080

  nodeSelector: {}
  replicas: 1
  resources:
    requests:
      cpu: 0
    limits:
      cpu: 0
  service:
    type: ""
    annotations: {}
  ingress:
    enabled: true
    annotations: {}
  ingressInternal:
    enabled: false
    annotations: {}
  tolerations: []

rows:
