{{- $csi := .Values.secrets.infisical.csi }}
{{- if $csi.enabled }}
{{- range $workload, $secrets := $csi.workloads }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "name" $ }}-{{ $workload }}-secrets
  namespace: {{ $.Release.Namespace }}
  labels: {{ include "hf.labels.commons" $ | nindent 4 }}
spec:
  provider: {{ $csi.provider | quote }}
  parameters:
    # Emitted even when it matches the provider's own fallback, because that fallback is "kubernetes",
    # which cannot work against an Infisical that has no route to this cluster's API server.
    authMethod: {{ required "secrets.infisical.csi.authMethod is required when secrets.infisical.csi.enabled is true" $csi.authMethod | quote }}
    infisicalUrl: {{ required "secrets.infisical.url is required when secrets.infisical.csi.enabled is true" $.Values.secrets.infisical.url | quote }}
    identityId: {{ required "secrets.infisical.csi.identityId is required when secrets.infisical.csi.enabled is true" $csi.identityId | quote }}
    projectId: {{ required "secrets.infisical.csi.projectId is required when secrets.infisical.csi.enabled is true" $csi.projectId | quote }}
    envSlug: {{ required "secrets.infisical.env is required when secrets.infisical.csi.enabled is true" $.Values.secrets.infisical.env | quote }}
    {{- with $csi.windowDuration }}
    windowDuration: {{ . | quote }}
    {{- end }}
    # One file per secret, named after the key, which is what libcommon.secrets reads.
    secrets: |
      {{- range $secrets }}
      - secretPath: {{ $csi.secretPath | default "/" | quote }}
        secretKey: {{ . | quote }}
        fileName: {{ . | quote }}
      {{- end }}
{{- end }}
{{- end }}
