{{- $csi := .Values.secrets.infisical.csi }}
{{- if $csi.enabled }}
{{- range $workload, $secrets := $csi.workloads }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "name" $ }}-{{ $workload }}-secrets
  namespace: {{ $.Release.Namespace }}
  labels: {{ include "hf.labels.commons" $ | nindent 4 }}
  annotations:
    # A hook, and at a lighter weight than the mongodb-migration job, because that job is a pre-upgrade
    # hook that mounts one of these. Ordinary resources are applied after every pre-upgrade hook has
    # finished, so the job would wait forever on a class that cannot exist yet, which is exactly what it
    # did on the first two attempts. Deleted only just before the next hook run, so it stays in place for
    # the pods that mount it in between.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  provider: {{ $csi.provider | quote }}
  parameters:
    # Emitted even when it matches the provider's own fallback, because that fallback is "kubernetes",
    # which cannot work against an Infisical that has no route to this cluster's API server.
    authMethod: {{ required "secrets.infisical.csi.authMethod is required when secrets.infisical.csi.enabled is true" $csi.authMethod | quote }}
    # Same value as the InfisicalSecret hostAPI, minus the /api suffix that one needs: the provider hands
    # this to the Infisical SDK as a site URL and the SDK appends /api/v1/... itself, so leaving the
    # suffix on produces /api/api/v1 and a 404 at mount time.
    infisicalUrl: {{ required "secrets.infisical.url is required when secrets.infisical.csi.enabled is true" $.Values.secrets.infisical.url | trimSuffix "/" | trimSuffix "/api" | quote }}
    identityId: {{ required "secrets.infisical.csi.identityId is required when secrets.infisical.csi.enabled is true" $csi.identityId | quote }}
    projectId: {{ required "secrets.infisical.csi.projectId is required when secrets.infisical.csi.enabled is true" $csi.projectId | quote }}
    envSlug: {{ required "secrets.infisical.env is required when secrets.infisical.csi.enabled is true" $.Values.secrets.infisical.env | quote }}
    {{- with $csi.windowDuration }}
    windowDuration: {{ . | quote }}
    {{- end }}
    # One file per secret, named after the key, which is what libcommon.secrets reads.
    secrets: |
      {{- range $secrets }}
      - secretPath: {{ $csi.secretPath | default "/" | quote }}
        secretKey: {{ . | quote }}
        fileName: {{ . | quote }}
      {{- end }}
{{- end }}
{{- end }}
